name: Update graduates wall

# Regenerates graduates/README.md, and the photos at the bottom of README.md,
# whenever a graduate file lands on main.
# The files were validated before merging and are only parsed, never run.
#
# A maintainer merges graduate PRs, so the push trigger catches them.
# workflow_run (after "Validate graduate") also keeps working if a merge is
# ever made with GITHUB_TOKEN, whose pushes don't start new workflows.

on:
  push:
    branches: [main]
    paths: ["graduates/*.py"]
  workflow_run:
    workflows: ["Validate graduate"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: graduates-wall

jobs:
  wall:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0 # the wall tool reads when each graduate was added
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python tools/graduates_wall.py
      - name: Commit if changed
        run: |
          if git diff --quiet; then echo "Wall already up to date."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update graduates wall"
          git push
